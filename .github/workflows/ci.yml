name: Traffic application CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m py_compile app.py flyover_model.py train_model.py scripts/baseline_compare.py scripts/explain_model.py scripts/cross_validate.py
          pip install -r requirements.txt -r requirements-analysis.txt pytest
      - name: Generate model artifacts
        run: python train_model.py
      - name: Run unit and integration tests
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m py_compile app.py flyover_model.py train_model.py
